spring.application.name=medabe-storage
server.port=${PORT:8090}

# H2 file DB cho demo; doi sang PostgreSQL bang bien moi truong (SPRING_DATASOURCE_*) khi trien khai.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/medabe;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=40MB
spring.http.codecs.max-in-memory-size=40MB

# Token quan tri/dich vu/SIEM: PHAI dat bang bien moi truong. De trong = tinh nang do bi khoa (khong con token mac dinh doan duoc).
medabe.admin-token=${MEDABE_ADMIN_TOKEN:}
medabe.service-token=${MEDABE_SERVICE_TOKEN:}
medabe.siem-token=${MEDABE_SIEM_TOKEN:}

# Tham so cong khai cua co quan ABE logic "MED" (xuat tu buoc dealer) va cac nut cap khoa.
medabe.k=2
medabe.pk-json=${MEDABE_PK_JSON:}
medabe.nodes=${MEDABE_NODES:}

# Thoi han luu giu khoa lich su (tuan), quy tac khoa thiet bi khi giai ma that bai lien tiep, han phá-vỡ-kính.
medabe.retention-weeks=4
medabe.fail-threshold=5
medabe.fail-window-minutes=10
medabe.break-glass-hours=24
medabe.siem-file=${MEDABE_SIEM_FILE:./data/siem/events.jsonl}

# Dang ky tu do (khong can ma moi): mac dinh TAT; chi bat khi tin cay mang noi bo. Admin bat/tat duoc trong luc chay.
medabe.open-enrollment=${MEDABE_OPEN_ENROLLMENT:false}

# Cong lien thong Bo Y te (mo phong): dia chi + khoa cong khai Ed25519 cua cong. De trong = khong bat. May chu cong bo (co chu ky registry) de may khach ghim.
medabe.byt-url=${MEDABE_BYT_URL:}
medabe.byt-pk=${MEDABE_BYT_PK:}

# Agent bao ve he thong (chay trong may chu, khong goi AI ngoai): theo doi su kien an ninh va TU DONG khoa thiet bi/khoa
# dang ky khi phat hien bat thuong. Tat bang MEDABE_AGENT_ENABLED=false neu can.
medabe.agent-enabled=${MEDABE_AGENT_ENABLED:true}
# Mot thiet bi bi tu choi (ACCESS_DENIED) >= nguong lan trong X phut => nghi van do quyen co he thong => tu khoa thiet bi.
medabe.agent-denied-threshold=${MEDABE_AGENT_DENIED_THRESHOLD:8}
medabe.agent-denied-window-minutes=${MEDABE_AGENT_DENIED_WINDOW_MINUTES:5}
# Co >= nguong thiet bi dang ky CUNG mot phan cung trong X phut => nghi van dang ky hang loat/nhan ban thiet bi => tu khoa cac thiet bi do.
medabe.agent-hw-burst-count=${MEDABE_AGENT_HW_BURST_COUNT:3}
medabe.agent-hw-burst-window-minutes=${MEDABE_AGENT_HW_BURST_WINDOW_MINUTES:5}
# Mot thiet bi pha-vo-kinh >= nguong BENH NHAN KHAC NHAU trong X phut => nghi van lam dung cap cuu => tu khoa thiet bi (khong dong cac lan cap cuu dang hieu luc).
medabe.agent-breakglass-patients=${MEDABE_AGENT_BREAKGLASS_PATIENTS:3}
medabe.agent-breakglass-window-minutes=${MEDABE_AGENT_BREAKGLASS_WINDOW_MINUTES:15}
# Tinh toan ven chuoi bam nhat ky quan tri duoc kiem moi 2 phut (SecurityAgentJob); chuoi gay => tu tat dang ky tu do.

# Tu cap nhat ung dung: thu muc chua ban moi nhat cua tung edition (admin.asar / user.asar), xuat tu
# app/desktop/update-packaged.mjs. De trong = tinh nang tat (/api/app/* tra 404). Chi la MA UNG DUNG (khong phai du lieu benh nhan),
# phuc vu LAN-only giong /api/config; may khach tu so hash de biet co ban moi khong, khong can dang nhap.
medabe.app-updates-dir=${MEDABE_APP_UPDATES_DIR:}

# Cam bien mang: phat hien dau hieu ARP spoofing/MITM trong LAN IPv4. Khong bao dam phat hien nghe len thu dong, moi dang MITM hoac IPv6.
# Khong co quan sat moi trong X phut => coi cam bien mat ket noi (heartbeat), KHONG ket luan "mang an toan".
medabe.net-stale-minutes=${MEDABE_NET_STALE_MINUTES:3}
# Mot IP doi MAC >= so lan nay trong lich su gan => nghi van thay doi bat thuong lap lai.
medabe.net-flap-threshold=${MEDABE_NET_FLAP_THRESHOLD:3}

# Tich hop Gemini (phan tich/giai thich canh bao bang tieng Viet). TAT mac dinh. Luat bao ve van chay khi AI tat/loi/het quota.
# Chi gui truong su kien da loc (KHONG gui ho so benh nhan, ten/CCCD, noi dung kham, khoa ABE, Bearer token, API key, PCAP).
medabe.ai-enabled=${MEDABE_AI_ENABLED:false}
medabe.gemini-api-key=${GEMINI_API_KEY:}
medabe.ai-model=${MEDABE_AI_MODEL:gemini-3.8-flash}
medabe.ai-timeout-ms=${MEDABE_AI_TIMEOUT_MS:12000}
medabe.ai-max-calls-per-hour=${MEDABE_AI_MAX_CALLS_PER_HOUR:40}
